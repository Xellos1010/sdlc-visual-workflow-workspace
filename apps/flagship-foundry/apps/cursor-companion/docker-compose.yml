# Cursor Companion — local dev services
#
# Brings up the Foundry control-plane API that the extension talks to.
# Run from this directory or use:
#   nx run cursor-companion:serve       (up)
#   nx run cursor-companion:teardown    (down)
#   nx run cursor-companion:dev         (up + extension dev host)

services:
  control-plane:
    build:
      context: ../../                         # apps/flagship-foundry/
      dockerfile: docker/Dockerfile.control-plane
    container_name: foundry-control-plane
    ports:
      - "4010:4010"
    volumes:
      # Persist graph/plan/run state across restarts
      - foundry-state:/app/state
      # Live-reload: mount source so edits take effect on restart
      - ../../apps/control-plane/src:/app/apps/control-plane/src:ro
      - ../../packages/core/src:/app/packages/core/src:ro
      - ../../packages/model-gateway/src:/app/packages/model-gateway/src:ro
      - ../../configs:/app/configs:ro
    environment:
      - FLAGSHIP_DEV_MODE=1
      - FLAGSHIP_ALLOW_LOOPBACK_NO_AUTH=1
      - FLAGSHIP_CORS_ORIGINS=http://localhost:3000,http://localhost:4010,http://localhost:5174,http://127.0.0.1:3000,http://127.0.0.1:4010,http://127.0.0.1:5174
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4010/health').then(r=>{if(!r.ok)throw r.status}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 8s
      retries: 3
    restart: unless-stopped

volumes:
  foundry-state:
    name: foundry-cursor-companion-state
