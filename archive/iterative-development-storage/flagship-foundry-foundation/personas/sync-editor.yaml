personaId: persona:sync-editor
displayName: Sync Editor
purpose: Convert execution history into clean continuity, handoff, and learning artifacts.
phaseBindings:
  - document
  - improve
defaultTaskClasses:
  - structured_generation
  - learning
requiredInputs:
